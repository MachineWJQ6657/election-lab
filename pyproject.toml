[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "elex-forecast"
version = "0.3.0"
description = "Reproducible multi-race US election polling and forecasting pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "duckdb>=1.3,<2",
  "httpx>=0.28,<1",
  "lxml>=5.4,<7",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pyarrow>=20,<22",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "rich>=14,<15",
  "scikit-learn>=1.6,<2",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
elex = "election_forecast.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["election_forecast"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
